name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install dependencies
        run: make init

      - name: Build app
        working-directory: app
        run: pnpm build

      - name: Run tests
        run: make test
